# ============================================================================
# Stability-Constrained Self-Improving Agents via Functional Trust Regions
# Default Configuration
# ============================================================================

# --- Reproducibility ---
seed: 42
num_seeds: 5  # For statistical rigor
seeds: [42, 137, 256, 512, 1024]
deterministic: true

# --- Device ---
device: "auto"  # auto, cpu, cuda, mps

# --- Functional Drift ---
drift:
  # Drift estimation
  num_reference_points: 512     # Number of points to estimate E_x[||f_θ(x) - f_θ0(x)||²]
  reference_batch_size: 128
  norm_type: "l2"               # l2, linf, kl
  # Constraint
  epsilon_init: 1.0             # Initial drift budget ε₀
  epsilon_min: 0.01             # Minimum ε
  epsilon_max: 10.0             # Maximum ε
  # Lagrangian
  lambda_init: 1.0              # Initial Lagrange multiplier λ₀ (start with real regularization)
  lambda_lr: 0.005              # Learning rate for dual variable (slower → more stable)
  lambda_max: 50.0              # Maximum λ
  lambda_momentum: 0.9          # EMA smoothing for dual updates (prevents oscillation)

# --- Adaptive Epsilon Scheduler ---
epsilon_scheduler:
  type: "fixed"                 # fixed, linear_decay, cosine, uncertainty
  warmup_steps: 0               # No warmup — constraint active from the start
  decay_rate: 0.995
  uncertainty_scale: 1.0        # Scale factor for uncertainty-based ε

# --- Training Defaults ---
training:
  optimizer: "adam"
  lr: 0.001
  weight_decay: 0.0
  batch_size: 128
  epochs: 50
  grad_clip: 1.0

# --- Experiment A: Continual Supervised Learning ---
experiment_a:
  name: "continual_cifar"
  dataset_sequence: ["cifar10", "cifar100"]
  model: "resnet18_small"
  epochs_per_task: 30
  lr: 0.001
  batch_size: 128
  num_tasks: 5                  # Split CIFAR-10 into 5 binary tasks
  ewc_lambda: 400.0             # For EWC baseline (tuned)
  drift_epsilon: 0.2            # FTR: KL-divergence budget (tuned: best AA-Fgt trade-off)
  drift_lambda: 1.0             # FTR: initial lambda (dual ascent adapts this)

# --- Additional method-specific config ---
si:
  c: 0.5                       # SI regularization strength

lwf:
  alpha: 1.0                   # LwF distillation weight
  temperature: 2.0             # Distillation temperature

replay:
  buffer_size: 500             # Total replay buffer size
  batch_size: 32               # Replay mini-batch size

distillation:
  lambda: 1.0                  # Fixed distillation weight

# --- MNIST benchmarks ---
mnist:
  num_tasks: 10                # Number of permutations / rotations
  batch_size: 256              # Larger batch for MNIST (simpler)
  epochs_per_task: 10          # MNIST is easier, fewer epochs

# --- CIFAR-100 benchmarks ---
cifar100:
  num_tasks: 10                # 10 tasks × 10 classes each

# --- Experiment B: Transformer Algorithmic ---
experiment_b:
  name: "transformer_algorithmic"
  tasks: ["copy", "reverse", "sort"]
  model:
    d_model: 64
    nhead: 4
    num_layers: 2
    dim_feedforward: 128
    max_seq_len: 32
    vocab_size: 16
  epochs_per_task: 50
  lr: 0.0005
  batch_size: 64
  drift_epsilon: 0.3
  drift_lambda: 0.5

# --- Experiment C: RL Gridworld ---
experiment_c:
  name: "rl_gridworld"
  grid_size: 8
  model:
    hidden_dim: 64
    num_layers: 2
  episodes: 2000
  lr: 0.001
  gamma: 0.99                  # RL discount factor
  drift_epsilon: 0.5
  drift_lambda: 0.5
  kl_coeff: 0.01               # For KL trust-region baseline

# --- Metrics ---
metrics:
  log_interval: 10              # Steps between metric logs
  eval_interval: 50             # Steps between evaluations
  save_checkpoints: true
  checkpoint_interval: 500

# --- Visualization ---
visualization:
  dpi: 300
  figsize: [8, 6]
  style: "seaborn-v0_8-whitegrid"
  colorblind_palette: true
  export_pdf: true
  font_size: 12

# --- Logging ---
logging:
  use_wandb: false
  project_name: "functional-trust-regions"
  log_dir: "logs"
  save_dir: "results"
